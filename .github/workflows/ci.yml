name: CI Pipeline - Dev

on:
  push:
    branches:
      - dev

jobs:

  # ─────────────────────────────────────────
  # JOB 1 : BUILD DE L'IMAGE DOCKER
  # ─────────────────────────────────────────
  build:
    name: "Job 1 - Build Docker Image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v3

      - name: Construction de l'image Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev .

      - name: Vérifier que l'image est bien construite
        run: |
          docker images | grep intranet-newdeal

      - name: Sauvegarder l'image pour les jobs suivants
        run: |
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev \
            -o intranet-newdeal.tar

      - name: Uploader l'image comme artefact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: intranet-newdeal.tar

  # ─────────────────────────────────────────
  # JOB 2 : SCAN DE SÉCURITÉ
  # ─────────────────────────────────────────
  security-scan:
    name: "Job 2 - Scan Sécurité"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v3

      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: |
          docker load -i intranet-newdeal.tar

      # --- Scan des vulnérabilités avec Trivy ---
      - name: Installer Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Scan des vulnérabilités (Trivy)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev

      # --- Scan des secrets dans le code avec Gitleaks ---
      - name: Scan des secrets dans le code (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  # JOB 3 : PUSH VERS DOCKER HUB
  # ─────────────────────────────────────────
  push:
    name: "Job 3 - Push vers Docker Hub"
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v3

      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: |
          docker load -i intranet-newdeal.tar

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l'image vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev

      - name: Confirmation du push
        run: |
          echo "Image pushée avec succès sur Docker Hub !"
          echo "Image : ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev"
