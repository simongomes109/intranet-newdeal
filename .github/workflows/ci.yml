name: CI Pipeline - Dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Job 1 - Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev .

  security-scan:
    name: Job 2 - Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image for scan
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev .

      - name: Install Trivy (vulnerability scan)
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan image vulnerabilities
        run: trivy image ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev

      - name: Scan secrets in code (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push:
    name: "Job 3 - Push vers Docker Hub"
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v3

      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i intranet-newdeal.tar

      - name: Connexion à Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push de l'image vers Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev

      - name: Build and Push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev
